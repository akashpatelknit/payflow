spring.application.name=payflow
# JDBC URL for PostgreSQL database
# Format: jdbc:postgresql://<host>:<port>/<database_name>
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${POSTGRES_DB:payflow}

# Database username used by Spring Boot to connect
spring.datasource.username=${POSTGRES_USER:postgres}

# Password for the database user (set POSTGRES_PASSWORD in your environment)
spring.datasource.password=${POSTGRES_PASSWORD:Akash@936920}

# PostgreSQL JDBC driver class
spring.datasource.driver-class-name=org.postgresql.Driver

# Let Hibernate create/update tables from entities (dev only)
spring.jpa.hibernate.ddl-auto=update
